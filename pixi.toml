[workspace]
name = "weftspun-keypoint"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "linux-aarch64", "osx-arm64", "osx-64"]

[dependencies]
python = ">=3.12"

# OpenUSD Python bindings. pypi ships wheels for linux-x86_64, macOS universal2
# and win_amd64. No linux-aarch64 wheel exists on pypi, so we host that one
# ourselves in repository-usd-core-wheels and point pixi at the release asset.
[pypi-dependencies]
usd-core = ">=26.8, <27"
markdown-it-py = ">=4.2.0, <5"

# Pin python to 3.12 on linux-aarch64 because the hosted wheel is cp312;
# other platforms can pick any python >= 3.12 that pypi ships a wheel for.
[target.linux-aarch64.dependencies]
python = "3.12.*"

[target.linux-aarch64.pypi-dependencies]
usd-core = { url = "https://github.com/V-Sekai-fire/repository-usd-core-wheels/releases/download/26.8-arm64-linux/usd_core-26.8-cp312-none-manylinux_2_27_aarch64.manylinux_2_28_aarch64.whl" }

[feature.gate.dependencies]
prek = "*"
ripgrep = "*"
pyyaml = "*"
clang-format = "==22.1.5"
codespell = "==2.4.2"

[feature.build.dependencies]
scons = "==4.11.1"
clangxx = "==22.1.5"
ninja = "*"
cmake = ">=3.28"

# Paths are relative to the manifest directory, which pixi resolves through the
# client-root symlink to the real checkout. Both that checkout and the .repo copy
# sit two levels below the client root, so ../../ reaches the workspace either way.
[feature.web.activation]
scripts = ["../../7-service/emsdk/emsdk_env.sh"]

[feature.web.target.win-64.activation]
scripts = ["../../7-service/emsdk/emsdk_env.bat"]

[environments]
gate = ["gate"]
build = ["build"]
web = ["build", "web"]

[tasks]
emsdk-install = "python ../../7-service/emsdk/emsdk.py install 6.0.9 && python ../../7-service/emsdk/emsdk.py activate 6.0.9"
